<!DOCTYPE html>
<html lang="en" data-lang="English">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Sample reports · Academic Commercialization Assessment</title>
<meta name="description" content="Read finished commercialization assessment reports without an account or API keys.">
<!-- Link previews; see the same block in index.html. As committed, this is
     the head of the list page, /samples. For /samples/<slug> the server
     rewrites the title, the two descriptions, og:title, og:url and the
     canonical link to the sample's own (api/crawlers.py), because a crawler
     runs no script and would otherwise read every sample as this one page.
     It finds each tag by the exact form written here: one tag per line,
     attributes in this order. -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="Academic Commercialization Assessment">
<meta property="og:title" content="Sample reports · Academic Commercialization Assessment">
<meta property="og:description" content="Read finished commercialization assessment reports without an account or API keys.">
<meta property="og:url" content="https://academic-agent.cc/samples">
<meta property="og:image" content="https://academic-agent.cc/static/brand/social-preview.png">
<meta property="og:image:width" content="1280">
<meta property="og:image:height" content="640">
<meta property="og:image:alt" content="From a paper or research topic to a cited assessment draft, beside a real historical scorecard">
<meta name="twitter:card" content="summary_large_image">
<!-- For a search engine: the one address this page has, whichever host it
     was read at; the address og:url gives. -->
<link rel="canonical" href="https://academic-agent.cc/samples">
<link rel="icon" type="image/svg+xml" href="/static/brand/aca-mark.svg">
<link rel="stylesheet" href="/static/css/tokens.css">
<link rel="stylesheet" href="/static/css/base.css">
<link rel="stylesheet" href="/static/css/result.css">
<link rel="stylesheet" href="/static/css/samples.css">
</head>
<body>
<a class="samples__skip" href="#sample-reader" data-samples-i18n="samples_skip">Skip to the report</a>

<!-- Deliberately not the main page's shell: that page asks for a sign-in
     before any view renders, or shows its landing page, which links here.
     Nothing here sends a credential or reaches a paid endpoint; it reads
     /api/samples, which serves committed files. -->
<div class="samples">
  <header class="samples__head">
    <a class="brand" href="/" aria-label="Academic Commercialization Assessment" data-i18n-aria-label="brand_full">
      <img class="brand__mark" src="/static/brand/aca-mark.svg" alt="">
      <span class="brand__name"><span class="brand__full" data-i18n="brand_full">Academic Commercialization Assessment</span><span class="brand__short" data-i18n="brand">ACA</span></span>
    </a>
    <div class="samples__nav">
      <a class="samples__back" href="/" data-samples-i18n="samples_back">Back to the app</a>
      <select class="bare-select" id="ui-lang" aria-label="Interface language" data-i18n-aria-label="aria_ui_language">
        <option value="English">EN</option>
        <option value="Simplified Chinese">中文</option>
      </select>
      <!-- Light or dark instead of following the system (theme.js). The label
           and the icon are set there; the icon shown is the theme it switches to. -->
      <button type="button" class="icon-btn" id="theme-toggle" data-theme-now="light"
              aria-label="Switch to dark theme" title="Switch to dark theme">
        <svg class="theme-icon theme-icon--moon" viewBox="0 0 16 16" fill="none" aria-hidden="true">
          <path d="M13.2 9.6A5.6 5.6 0 0 1 6.4 2.8a5.6 5.6 0 1 0 6.8 6.8Z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/>
        </svg>
        <svg class="theme-icon theme-icon--sun" viewBox="0 0 16 16" fill="none" aria-hidden="true">
          <circle cx="8" cy="8" r="2.8" stroke="currentColor" stroke-width="1.3"/>
          <path d="M8 1.8v1.4M8 12.8v1.4M1.8 8h1.4M12.8 8h1.4M3.6 3.6l1 1M11.4 11.4l1 1M12.4 3.6l-1 1M4.6 11.4l-1 1" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
        </svg>
      </button>
    </div>
  </header>

  <section class="samples__intro">
    <h1 data-samples-i18n="samples_title">Sample reports</h1>
    <p data-samples-i18n="samples_sub">Finished assessments you can read without an account or API keys.</p>
  </section>

  <!-- Placeholders until /api/samples answers (samples.js replaces them):
       the reader used to say "Choose a report above." while there was
       nothing above to choose from. -->
  <nav class="samples__list" id="sample-list" aria-label="Sample reports" aria-busy="true">
    <span class="sample-card sample-card--placeholder" aria-hidden="true"></span>
    <span class="sample-card sample-card--placeholder" aria-hidden="true"></span>
    <span class="sample-card sample-card--placeholder" aria-hidden="true"></span>
    <span class="sample-card sample-card--placeholder" aria-hidden="true"></span>
  </nav>

  <!-- The reader is the page's main landmark, so a screen reader can jump
       to the report and a keyboard can skip to it (the link above). It is
       focusable but not in the Tab order (tabindex="-1"), so following the
       link moves focus to it and the next Tab lands inside the report. -->
  <main class="samples__reader" id="sample-reader" aria-live="polite" tabindex="-1">
    <div class="skeleton"></div>
  </main>
</div>

<script type="module" src="/static/js/samples.js"></script>
<script type="module" src="/static/js/theme.js"></script>
</body>
</html>
