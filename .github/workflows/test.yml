name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Nothing here writes to the repository: the token is read-only even if the
# repository default ever changes.
permissions:
  contents: read

# A pull request's newer push replaces its older run instead of queueing
# behind it: the older result describes a commit nobody is waiting on. A
# push to main is grouped by its own commit, so no run of a merged commit
# is ever cancelled (the deploy check waits on exactly that run).
concurrency:
  group: tests-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Every JavaScript action below deliberately uses a major whose official
# action.yml declares Node 24.  Older majors still appear to pass because
# GitHub temporarily forces them onto Node 24, but that compatibility shim emits
# a deprecation warning and is not a stable runtime contract.
jobs:
  test:
    name: pytest (${{ matrix.os }}, py${{ matrix.python-version }}, part ${{ matrix.shard }} of 5)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows is not incidental here: font resolution walks C:/Windows/Fonts,
        # and the benchmark's process pool uses spawn rather than fork, so a
        # Linux-only matrix would never exercise either path.
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
        # Each cell's tests are split by file over five runners, and each
        # part still runs serially on a runner of its own. Measured
        # 2026-11-11: a pull request waited 11 to 13 minutes on the one
        # cell that runs all 8,654 tests under coverage (630 s of pytest),
        # with the Windows cells behind it at 436 s. The slowest single
        # test took 5.8 s and installing 13 to 32 s, so the time is the
        # number of tests, and running them in parallel inside one runner
        # is what #228 tried and withdrew. tests/conftest.py does the
        # split (ACA_TEST_SHARD) and balances the parts by each file's
        # measured CI time (tests/ci_test_durations.json);
        # tests/test_ci_sharding.py holds that the parts are a partition of
        # the cell's tests.
        # Five, measured 2026-11-23 on 16 runs: three parts balanced by test
        # count made the run wait a median 404 s, 15 times out of 16 on a
        # Windows part. Balanced by time, a Windows cell's 726 s of tests
        # come to about 145 s a part at five (180 s at four, 120 s at six).
        # Every part also pays about 30 s of setup and 20-30 s of collection
        # on Windows, so each part added saves less than the one before;
        # five keeps a run at 20 test jobs plus five others, inside the
        # account's 40 concurrent jobs with room for a second run.
        shard: [1, 2, 3, 4, 5]
    env:
      ACA_TEST_SHARD: ${{ matrix.shard }}/5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Install uv and Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: "latest"
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --python ${{ matrix.python-version }}

      # Several browser-contract tests execute the real client JavaScript and
      # skip locally when Node is unavailable. CI must not turn a missing
      # runtime into a green job with those assertions silently absent.
      - name: Require Node for web contract tests
        run: node --version

      - name: Run tests
        if: matrix.os != 'ubuntu-latest' || matrix.python-version != '3.12'
        # Warning filters live in pyproject.toml so this command is identical
        # on both shells — see the filterwarnings comment there.
        # Both paths report slow test phases without changing collection or
        # the coverage measurement core; timings alone do not explain a cause.
        # Serial on purpose. With -n auto (#228) about half of the CI runs
        # hit a timing-sensitive concurrency test on a saturated runner;
        # re-enable it once those tests are parallel-safe.
        # These cells skip tests of closed experiments (marker `experiment`,
        # tests/experiment_tests.txt): about 80% of suite time, for code the
        # app and pipeline never import. The coverage cell below still runs
        # them on every PR, and full-suite.yml runs everything on every cell
        # weekly.
        run: uv run --python ${{ matrix.python-version }} pytest tests/ -m "not experiment" -v --tb=short --durations=40

      - name: Run tests and record this part's coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        # The canonical cell measures coverage during its only full-suite run,
        # every test, experiments included, so the metric is unchanged. One
        # part covers a fifth of that, so the floor is not applied here: each
        # part keeps its data and the coverage job below combines the five
        # and applies the unchanged 85% (a fresh full run measured 87% on
        # 2026-08-24). sys.monitoring (Python 3.12+) measures the same line
        # coverage as the trace-function core at a fraction of its overhead.
        env:
          COVERAGE_CORE: sysmon
          COVERAGE_FILE: .coverage.${{ matrix.shard }}
        run: >
          uv run --python ${{ matrix.python-version }} pytest tests/ -v --tb=short --durations=40
          --cov=src/academic_agent
          --cov=api
          --cov=ui
          --cov-report=

      - name: Keep this part's coverage data for the floor
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        # A dotfile: the action leaves hidden files out unless told, and a
        # part with no data must fail here rather than lower the total there.
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: coverage-data-${{ matrix.shard }}
          path: .coverage.${{ matrix.shard }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  cells:
    name: pytest (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: test
    if: ${{ always() }}
    # The four names the branch ruleset requires, kept as they were before
    # the cells were split. Each is green only when every part of every cell
    # passed; which part failed is read from the test jobs themselves.
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - name: Require every part of every cell to pass
        shell: bash
        env:
          MATRIX_RESULT: ${{ needs.test.result }}
        run: test "$MATRIX_RESULT" = success

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: "latest"
          python-version: "3.12"

      - name: ruff
        run: uv run --with ruff ruff check .

      - name: pylint (exception-order checks only)
        # Narrow on purpose. ruff has no equivalent of E0701, which is exactly
        # what a real bug in this repo looked like: `except HTTPError` placed
        # after `except URLError` is dead code, since HTTPError subclasses
        # URLError — so every auth failure was retried as if transient.
        # Running all of pylint would drown that signal in style noise.
        run: >
          uv run --with pylint pylint src/ ui/ api/
          --disable=all
          --enable=bad-except-order,unreachable,used-before-assignment,undefined-variable
          --score=n

  coverage:
    name: coverage floor (Ubuntu, py3.12)
    runs-on: ubuntu-latest
    needs: test
    if: ${{ always() }}
    # Requires the whole matrix to have succeeded (failed, cancelled or skipped
    # dependencies must not become a green check), then combines the five
    # parts' coverage data from the canonical cell and applies the floor to
    # the total. No test runs here.
    steps:
      - name: Require the tested matrix to pass
        shell: bash
        env:
          MATRIX_RESULT: ${{ needs.test.result }}
        run: test "$MATRIX_RESULT" = success

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Install uv and Python 3.12
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: "latest"
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --python 3.12

      - name: Fetch every part's coverage data
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: coverage-data-*
          merge-multiple: true

      - name: Require all five parts
        # A missing part would lower nothing visibly: its files would only
        # count as never executed. Five or the floor is not measured.
        shell: bash
        run: test "$(ls .coverage.* | wc -l)" = 5

      - name: Combine the parts
        run: uv run --python 3.12 coverage combine

      - name: Apply the measured coverage floor to the total
        run: uv run --python 3.12 coverage report --show-missing --fail-under=85

  # The ten browser journeys run in two parts on two runners, each part's
  # journeys still one after another on its own. Measured 2026-11-23 on 16
  # runs, the single job took a median 250 s, 208 s of it the journeys, which
  # made it the longest job once the pytest parts were rebalanced. The parts
  # are split by those times (the read-only journey alone is 94 s), and each
  # pays the same 35 s of setup. Every journey is in exactly one part, every
  # step is unconditional, and the job below keeps the name the branch
  # ruleset requires, green only when both parts passed.
  browser-smoke-1:
    name: browser smoke (Chromium, zero-provider, part 1 of 2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Install uv and Python 3.12
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: "latest"
          python-version: "3.12"

      # One canonical Linux job owns the real-browser contract. Installing a
      # browser in every pytest matrix cell would multiply a large download
      # without adding a new application boundary: this smoke checks the same
      # production SPA, FastAPI routes and disk-backed run reader each time.
      - name: Install the opt-in E2E dependency group
        run: uv sync --python 3.12 --group e2e

      - name: Install Chromium and system dependencies
        run: uv run --python 3.12 --group e2e playwright install --with-deps chromium

      - name: Exercise the zero-provider browser journey
        run: uv run --python 3.12 --group e2e python -m e2e.browser_smoke

      - name: Exercise the isolated saved-source entry with a scripted selector
        # A separate unmounted app owns this POST journey. Its selector is a
        # fixture callback, not a provider; existing smoke guards stay intact.
        run: uv run --python 3.12 --group e2e python -m e2e.saved_source_smoke

      - name: Rehearse the receipt Qwen boundary with intercepted provider responses
        # Default module mode is fake-key/zero-provider Chromium, never the paid
        # CLI. It traverses the real selector transport, HTTP app and receipts.
        run: uv run --python 3.12 --group e2e python -m e2e.saved_source_receipt_qwen_canary

      - name: Verify isolated native usage reaches durable receipts and the browser
        # Fake-key intercepted HTTP only. The usage page is not mounted in the
        # public app and this smoke cannot authorize a provider request.
        run: uv run --python 3.12 --group e2e python -m e2e.saved_source_usage_smoke

      - name: Upload the failure screenshot
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: browser-smoke-failure-1
          path: output/playwright/
          if-no-files-found: ignore
          retention-days: 7

  browser-smoke-2:
    name: browser smoke (Chromium, zero-provider, part 2 of 2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Install uv and Python 3.12
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: "latest"
          python-version: "3.12"

      # One canonical Linux job owns the real-browser contract. Installing a
      # browser in every pytest matrix cell would multiply a large download
      # without adding a new application boundary: this smoke checks the same
      # production SPA, FastAPI routes and disk-backed run reader each time.
      - name: Install the opt-in E2E dependency group
        run: uv sync --python 3.12 --group e2e

      - name: Install Chromium and system dependencies
        run: uv run --python 3.12 --group e2e playwright install --with-deps chromium

      - name: Exercise the composer with intercepted paid-operation responses
        # A static-only server has no paid API routes. Browser-fulfilled POSTs
        # cover submit/upload races without relaxing the read-only journey.
        run: uv run --python 3.12 --group e2e python -m e2e.composer_smoke

      - name: Walk the gate, BYOK, a run and the phone menu by keyboard only
        # Same static-only server and browser-fulfilled POSTs as the composer
        # journey; Tab, Shift+Tab, Enter, Space and Escape are the only input.
        run: uv run --python 3.12 --group e2e python -m e2e.keyboard_smoke

      - name: Open the pages in a zh-CN and an en-US browser and switch the landing's language
        # Same static-only server; the browser answers the API as the public
        # deployment answers a visitor who is not signed in. No POST is made.
        run: uv run --python 3.12 --group e2e python -m e2e.language_smoke

      - name: Recover isolated saved-source receipts after a lost acknowledgement
        # Real loopback POST/GET traverses the controller and journal; only a
        # scripted selector is injected. This does not mount a production route.
        run: uv run --python 3.12 --group e2e python -m e2e.saved_source_receipt_smoke

      - name: Verify default-off production locator consent and receipt recovery
        # The real main application uses synthetic owner data and a fake-key
        # intercepted transport. No deployment flag or paid grant is changed.
        run: uv run --python 3.12 --group e2e python -m e2e.source_locator_production_smoke

      - name: Verify public HTTPS locator origin over a loopback HTTP backend
        # Railway terminates TLS before ASGI. Keep this distinct from direct
        # loopback success; the fixed proxy harness never reaches a provider.
        run: uv run --python 3.12 --group e2e python -m e2e.source_locator_production_smoke --proxy

      - name: Upload the failure screenshot
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: browser-smoke-failure-2
          path: output/playwright/
          if-no-files-found: ignore
          retention-days: 7

  browser-smoke:
    name: browser smoke (Chromium, zero-provider)
    runs-on: ubuntu-latest
    needs: [browser-smoke-1, browser-smoke-2]
    if: ${{ always() }}
    # The name the branch ruleset requires, as it was before the journeys
    # were split. A failed, cancelled or skipped part must not become a green
    # check; which journey failed is read from the part that ran it.
    steps:
      - name: Require both parts of the browser smoke to pass
        shell: bash
        env:
          PARTS_RESULT: ${{ needs.browser-smoke-1.result }} ${{ needs.browser-smoke-2.result }}
        run: test "$PARTS_RESULT" = "success success"

  docker:
    name: docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4

      # The image build runs scripts/verify_container_fonts.py, and that check
      # is the point of this job. The font the exporter needs is decided by two
      # files that are edited independently: the apt package in the Dockerfile
      # and the candidate paths in ui/pdf_export.py. When they disagree, the
      # PDF silently falls back to a CID font and Chinese reports render as
      # blank boxes for whoever opens them — no error anywhere.
      #
      # That is not hypothetical. Debian ships Noto CJK with PostScript
      # outlines, which reportlab cannot read, so the first build of this image
      # failed the check on all four languages while every path in it existed.
      # Nothing in the test suite can catch that: it depends on which font
      # files the base image happens to contain.
      - name: Build image (runs the CJK font check)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7
        with:
          context: .
          push: false
          load: true
          tags: academic-agent:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Cheap assertions on things the Dockerfile promises and a build alone
      # would not prove.
      #
      # Note the absence of --entrypoint: overriding it replaces tini, so
      # `--entrypoint sh ... 'cat /proc/1/comm'` reports "sh" and the first
      # check below can never pass. Passing the command as arguments lets tini
      # stay PID 1 and exec it, which is what production actually looks like.
      - name: Verify runtime contract
        run: |
          set -euo pipefail

          echo "PID 1 must be tini, or cancelled runs leak zombie workers"
          pid1=$(docker run --rm academic-agent:ci sh -c 'cat /proc/1/comm')
          echo "  got: $pid1"
          [ "$pid1" = "tini" ]

          echo "Container must not run as root"
          uid=$(docker run --rm academic-agent:ci id -u)
          echo "  got uid: $uid"
          [ "$uid" != "0" ]

          echo "All four CJK languages must resolve to an embedded font"
          docker run --rm academic-agent:ci python scripts/verify_container_fonts.py

          echo "The application must import from the image's own files"
          # .dockerignore excludes tests, docs and experiment runners; this
          # fails the build if the serving code depends on any of them.
          docker run --rm academic-agent:ci python -c "import api.main, academic_agent.main, academic_agent.pipeline_worker"

          echo "Sample reports must ship, or /samples serves 404s"
          docker run --rm academic-agent:ci python -c "from api import samples; [samples.read_sample(s.slug) for s in samples.SAMPLES]"

          echo "Excluded development files must not ship"
          docker run --rm academic-agent:ci sh -c '! ls -d tests docs evals experiments benchmark.py 2>/dev/null | grep .'
