name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Every JavaScript action below deliberately uses a major whose official
# action.yml declares Node 24.  Older majors still appear to pass because
# GitHub temporarily forces them onto Node 24, but that compatibility shim emits
# a deprecation warning and is not a stable runtime contract.
jobs:
  test:
    name: pytest (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows is not incidental here: font resolution walks C:/Windows/Fonts,
        # and the benchmark's process pool uses spawn rather than fork, so a
        # Linux-only matrix would never exercise either path.
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v7

      - name: Install uv and Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "latest"
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --python ${{ matrix.python-version }}

      # Several browser-contract tests execute the real client JavaScript and
      # skip locally when Node is unavailable. CI must not turn a missing
      # runtime into a green job with those assertions silently absent.
      - name: Require Node for web contract tests
        run: node --version

      - name: Run tests
        if: matrix.os != 'ubuntu-latest' || matrix.python-version != '3.12'
        # Warning filters live in pyproject.toml so this command is identical
        # on both shells — see the filterwarnings comment there.
        run: uv run --python ${{ matrix.python-version }} pytest tests/ -v --tb=short

      - name: Run tests with the measured coverage floor
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        # The canonical cell measures coverage during its only full-suite run.
        # A fresh full run measured 87% on 2026-08-24; the unchanged 85% floor
        # leaves room for platform-specific defensive branches. Other cells
        # still run every test, without redefining this single-platform metric.
        run: >
          uv run --python ${{ matrix.python-version }} pytest tests/ -v --tb=short
          --cov=src/academic_agent
          --cov=api
          --cov=ui
          --cov-report=term-missing
          --cov-fail-under=85

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "latest"
          python-version: "3.12"

      - name: ruff
        run: uv run --with ruff ruff check .

      - name: pylint (exception-order checks only)
        # Narrow on purpose. ruff has no equivalent of E0701, which is exactly
        # what a real bug in this repo looked like: `except HTTPError` placed
        # after `except URLError` is dead code, since HTTPError subclasses
        # URLError — so every auth failure was retried as if transient.
        # Running all of pylint would drown that signal in style noise.
        run: >
          uv run --with pylint pylint src/ ui/ api/
          --disable=all
          --enable=bad-except-order,unreachable,used-before-assignment,undefined-variable
          --score=n

  coverage:
    name: coverage floor (Ubuntu, py3.12)
    runs-on: ubuntu-latest
    needs: test
    if: ${{ always() }}
    # Preserve the existing check name without a fifth full-suite run. This
    # gate requires the whole matrix, including canonical coverage, to succeed;
    # failed, cancelled or skipped dependencies must not become a green check.
    steps:
      - name: Require the tested matrix and canonical coverage to pass
        shell: bash
        env:
          MATRIX_RESULT: ${{ needs.test.result }}
        run: test "$MATRIX_RESULT" = success

  browser-smoke:
    name: browser smoke (Chromium, zero-provider)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv and Python 3.12
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "latest"
          python-version: "3.12"

      # One canonical Linux job owns the real-browser contract. Installing a
      # browser in every pytest matrix cell would multiply a large download
      # without adding a new application boundary: this smoke checks the same
      # production SPA, FastAPI routes and disk-backed run reader each time.
      - name: Install the opt-in E2E dependency group
        run: uv sync --python 3.12 --group e2e

      - name: Install Chromium and system dependencies
        run: uv run --python 3.12 --group e2e playwright install --with-deps chromium

      - name: Exercise the zero-provider browser journey
        run: uv run --python 3.12 --group e2e python -m e2e.browser_smoke

      - name: Exercise the composer with intercepted paid-operation responses
        # A static-only server has no paid API routes. Browser-fulfilled POSTs
        # cover submit/upload races without relaxing the read-only journey.
        run: uv run --python 3.12 --group e2e python -m e2e.composer_smoke

      - name: Exercise the isolated saved-source entry with a scripted selector
        # A separate unmounted app owns this POST journey. Its selector is a
        # fixture callback, not a provider; existing smoke guards stay intact.
        run: uv run --python 3.12 --group e2e python -m e2e.saved_source_smoke

      - name: Recover isolated saved-source receipts after a lost acknowledgement
        # Real loopback POST/GET traverses the controller and journal; only a
        # scripted selector is injected. This does not mount a production route.
        run: uv run --python 3.12 --group e2e python -m e2e.saved_source_receipt_smoke

      - name: Rehearse the receipt Qwen boundary with intercepted provider responses
        # Default module mode is fake-key/zero-provider Chromium, never the paid
        # CLI. It traverses the real selector transport, HTTP app and receipts.
        run: uv run --python 3.12 --group e2e python -m e2e.saved_source_receipt_qwen_canary

      - name: Verify isolated native usage reaches durable receipts and the browser
        # Fake-key intercepted HTTP only. The usage page is not mounted in the
        # public app and this smoke cannot authorize a provider request.
        run: uv run --python 3.12 --group e2e python -m e2e.saved_source_usage_smoke

      - name: Upload the failure screenshot
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: browser-smoke-failure
          path: output/playwright/
          if-no-files-found: ignore
          retention-days: 7

  docker:
    name: docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # The image build runs scripts/verify_container_fonts.py, and that check
      # is the point of this job. The font the exporter needs is decided by two
      # files that are edited independently: the apt package in the Dockerfile
      # and the candidate paths in ui/pdf_export.py. When they disagree, the
      # PDF silently falls back to a CID font and Chinese reports render as
      # blank boxes for whoever opens them — no error anywhere.
      #
      # That is not hypothetical. Debian ships Noto CJK with PostScript
      # outlines, which reportlab cannot read, so the first build of this image
      # failed the check on all four languages while every path in it existed.
      # Nothing in the test suite can catch that: it depends on which font
      # files the base image happens to contain.
      - name: Build image (runs the CJK font check)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: academic-agent:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Cheap assertions on things the Dockerfile promises and a build alone
      # would not prove.
      #
      # Note the absence of --entrypoint: overriding it replaces tini, so
      # `--entrypoint sh ... 'cat /proc/1/comm'` reports "sh" and the first
      # check below can never pass. Passing the command as arguments lets tini
      # stay PID 1 and exec it, which is what production actually looks like.
      - name: Verify runtime contract
        run: |
          set -euo pipefail

          echo "PID 1 must be tini, or cancelled runs leak zombie workers"
          pid1=$(docker run --rm academic-agent:ci sh -c 'cat /proc/1/comm')
          echo "  got: $pid1"
          [ "$pid1" = "tini" ]

          echo "Container must not run as root"
          uid=$(docker run --rm academic-agent:ci id -u)
          echo "  got uid: $uid"
          [ "$uid" != "0" ]

          echo "All four CJK languages must resolve to an embedded font"
          docker run --rm academic-agent:ci python scripts/verify_container_fonts.py
