[project]
name = "academic_agent"
version = "1.0.0"
description = "Academic research commercialization assessment agent built with CrewAI"
authors = [{ name = "Jason Chai", email = "shuxiachai@163.com" }]
requires-python = ">=3.11,<3.14"
dependencies = [
    "arize-phoenix-otel>=0.16,<1",
    "crewai[tools]==1.14.7",
    "fastapi>=0.115",
    "markdown>=3.6",
    "openinference-instrumentation-anthropic>=0.1,<1",
    "openinference-instrumentation-crewai>=0.1,<1",
    "openinference-instrumentation-openai>=0.1,<1",
    "pydantic>=2.0",
    "pypdfium2>=4.0",
    "reportlab>=4.0",
    "uvicorn>=0.34",
]

[project.scripts]
academic_agent = "academic_agent.main:run"
run_crew = "academic_agent.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"

[tool.pytest.ini_options]
pythonpath = ["."]
# Turning UserWarning into an error is what stops a test from quietly calling a
# real API: those paths warn and fall back rather than raising, so a leak would
# otherwise pass. Configured here rather than on the CI command line because the
# httpx filter contains a backtick, which PowerShell reads as an escape and bash
# reads as command substitution — the same command cannot survive both shells.
filterwarnings = [
    "error::UserWarning",
    "ignore::DeprecationWarning",
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

[tool.ruff]
line-length = 120
target-version = "py311"
exclude = [".venv", ".claude", "outputs", "__pycache__"]

[tool.ruff.lint]
# Deliberately narrow: rules that catch defects, not rules that enforce taste.
# E501 (line length) is off because the codebase uses aligned dict literals and
# long URLs in font-path tables where wrapping hurts readability.
select = [
    "F",      # pyflakes — undefined names, unused imports; catches real bugs
    "E4",     # import placement
    "E7",     # statement-level mistakes (comparison to None/True, etc.)
    "E9",     # syntax / IO errors
    "B",      # bugbear — mutable defaults, except-in-loop, missing raise-from
    "UP",     # pyupgrade — keeps syntax current with the 3.11 floor
]
ignore = [
    "B008",   # function call in default arg — intentional for DI defaults
    "B028",   # warnings.warn without stacklevel — the messages name their source
    # UP037 would unquote annotations that reference lazily-imported names.
    # Several modules defer heavy imports into function bodies, so the name
    # genuinely does not exist at module scope and unquoting breaks at runtime.
    "UP037",
]

[tool.ruff.lint.per-file-ignores]
# Tests reach into private helpers by design, and fixtures shadow builtins.
"tests/*" = ["F811", "E402"]
# These entry points reconfigure stdout/stderr encoding or load .env before
# importing anything that depends on it — the ordering is the point.
"api/main.py" = ["E402"]
"app.py" = ["E402"]
"benchmark.py" = ["E402"]
"benchmark_check.py" = ["E402"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7,<8",
]
